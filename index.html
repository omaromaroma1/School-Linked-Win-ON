<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Links</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
 
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }
 
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px 40px 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }
 
    h1 {
      font-size: 2rem;
      margin-bottom: 28px;
      color: #1a1a2e;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }
 
    /* ── Link list ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 24px;
    }
 
    .link-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
 
    .link-btn {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      display: block;
      border: none;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .link-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.13); }
 
    /* colour swatch next to each link */
    .color-pick {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }
    .color-pick input[type="color"] {
      width: 200%; height: 200%;
      border: none; cursor: pointer;
      transform: translate(-25%,-25%);
    }
 
    .empty-msg { color: #9ca3af; font-size: 0.9rem; padding: 10px 0; }
 
    /* ── Bottom button bar ── */
    .bottom-bar {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
 
    .toggle-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.18s;
      letter-spacing: 0.3px;
    }
    .toggle-btn:hover { transform: translateY(-2px); }
 
    .btn-add  { background: #e0e7ff; color: #4338ca; }
    .btn-add.open  { background: #4338ca; color: #fff; }
    .btn-del  { background: #fee2e2; color: #dc2626; }
    .btn-del.open  { background: #dc2626; color: #fff; }
 
    /* ── Expandable panels ── */
    .panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s ease, padding 0.35s ease, margin 0.35s ease;
      margin-top: 0;
    }
    .panel.open {
      max-height: 400px;
      margin-top: 14px;
    }
 
    .panel-inner {
      background: #f8f9ff;
      border-radius: 14px;
      padding: 18px;
      text-align: left;
    }
 
    /* Add panel */
    .add-form { display: flex; flex-direction: column; gap: 9px; }
 
    .add-form input[type="text"],
    .add-form input[type="url"] {
      padding: 10px 13px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .add-form input:focus { border-color: #6366f1; }
 
    .color-row {
      display: flex;
      gap: 9px;
      align-items: center;
    }
    .color-row input[type="text"] { flex: 1; }
 
    .bg-swatch {
      width: 42px; height: 42px;
      border-radius: 10px;
      border: 2px solid #e5e7eb;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }
    .bg-swatch input[type="color"] {
      width: 200%; height: 200%;
      border: none; cursor: pointer;
      transform: translate(-25%,-25%);
    }
 
    .confirm-btn {
      width: 100%;
      padding: 11px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 11px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.18s;
    }
    .confirm-btn:hover { background: #4f46e5; transform: translateY(-2px); }
 
    /* Delete panel */
    .del-list { display: flex; flex-direction: column; gap: 8px; }
 
    .del-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border-radius: 10px;
      padding: 10px 13px;
      border: 2px solid #fee2e2;
    }
    .del-row span { font-weight: 600; color: #374151; font-size: 0.95rem; }
 
    .del-x {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      border-radius: 8px;
      width: 28px; height: 28px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .del-x:hover { background: #fca5a5; }
 
    .del-empty { color: #9ca3af; font-size: 0.88rem; text-align: center; padding: 6px 0; }
  </style>
</head>
<body>
<div class="container">
  <h1>School Links</h1>
 
  <!-- Links -->
  <div class="links" id="linkList"></div>
 
  <!-- Bottom Buttons -->
  <div class="bottom-bar">
    <button class="toggle-btn btn-add" id="addToggle" onclick="togglePanel('add')">＋ Add</button>
    <button class="toggle-btn btn-del" id="delToggle" onclick="togglePanel('del')">🗑 Delete</button>
  </div>
 
  <!-- Add Panel -->
  <div class="panel" id="addPanel">
    <div class="panel-inner">
      <div class="add-form">
        <input type="text" id="newName" placeholder="Name (e.g. Classroom)" />
        <input type="url"  id="newUrl"  placeholder="URL (e.g. https://...)" />
        <div class="color-row">
          <input type="text" id="newTextColor" placeholder="Text color (optional)" />
          <div class="bg-swatch" id="bgPreview" style="background:#e8f0fe;" title="Pick background color">
            <input type="color" id="newBgColor" value="#e8f0fe"
              oninput="document.getElementById('bgPreview').style.background=this.value" />
          </div>
        </div>
        <button class="confirm-btn" onclick="addLink()">Add Link</button>
      </div>
    </div>
  </div>
 
  <!-- Delete Panel -->
  <div class="panel" id="delPanel">
    <div class="panel-inner">
      <div class="del-list" id="delList"></div>
    </div>
  </div>
</div>
 
<script>
  const defaultLinks = [
    { name: "McGrawHill",   url: "https://my.mheducation.com/login",                                                                            bg: "#e8f0fe", color: "#1a56db" },
    { name: "Khan Academy", url: "https://www.khanacademy.org/profile/me/classroom/ce0ca203-5a26-4bcf-8287-8304cbc765e7",                       bg: "#fef3e2", color: "#c05621" },
    { name: "Classroom",    url: "https://classroom.google.com/u/3/h",                                                                          bg: "#e6fffa", color: "#0d9488" },
    { name: "Alma",         url: "https://gaaq.getalma.com/home",                                                                               bg: "#fce8f3", color: "#9d174d" },
  ];
 
  let links = JSON.parse(localStorage.getItem('schoolLinks') || 'null') || defaultLinks;
  let openPanel = null;
 
  function save() { localStorage.setItem('schoolLinks', JSON.stringify(links)); }
 
  function autoTextColor(hex) {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b)/255 > 0.55 ? '#1a1a2e' : '#ffffff';
  }
 
  function render() {
    const list = document.getElementById('linkList');
    list.innerHTML = links.length === 0
      ? '<p class="empty-msg">No links yet. Add one below!</p>'
      : links.map((l,i) => `
          <div class="link-row">
            <a class="link-btn" href="${l.url}" target="_blank"
               style="background:${l.bg};color:${l.color}">${l.name}</a>
            <label class="color-pick" style="background:${l.bg}" title="Change color">
              <input type="color" value="${l.bg}" oninput="changeColor(${i},this.value)" />
            </label>
          </div>`).join('');
 
    // delete panel list
    const dl = document.getElementById('delList');
    dl.innerHTML = links.length === 0
      ? '<p class="del-empty">Nothing to delete.</p>'
      : links.map((l,i) => `
          <div class="del-row">
            <span>${l.name}</span>
            <button class="del-x" onclick="deleteLink(${i})">✕</button>
          </div>`).join('');
  }
 
  function changeColor(i, bg) {
    links[i].bg = bg; links[i].color = autoTextColor(bg);
    save(); render();
  }
 
  function deleteLink(i) {
    links.splice(i,1); save(); render();
  }
 
  function addLink() {
    const name  = document.getElementById('newName').value.trim();
    const url   = document.getElementById('newUrl').value.trim();
    const bg    = document.getElementById('newBgColor').value;
    let   color = document.getElementById('newTextColor').value.trim();
 
    if (!name || !url) { alert('Please enter both a name and a URL.'); return; }
    if (!url.startsWith('http')) { alert('URL must start with http:// or https://'); return; }
    if (!color) color = autoTextColor(bg);
 
    links.push({name, url, bg, color});
    save(); render();
 
    document.getElementById('newName').value = '';
    document.getElementById('newUrl').value  = '';
    document.getElementById('newTextColor').value = '';
    document.getElementById('newBgColor').value = '#e8f0fe';
    document.getElementById('bgPreview').style.background = '#e8f0fe';
  }
 
  function togglePanel(which) {
    const addPanel = document.getElementById('addPanel');
    const delPanel = document.getElementById('delPanel');
    const addBtn   = document.getElementById('addToggle');
    const delBtn   = document.getElementById('delToggle');
 
    if (openPanel === which) {
      // close current
      addPanel.classList.remove('open'); delPanel.classList.remove('open');
      addBtn.classList.remove('open');   delBtn.classList.remove('open');
      openPanel = null;
    } else {
      // close both, open chosen
      addPanel.classList.remove('open'); delPanel.classList.remove('open');
      addBtn.classList.remove('open');   delBtn.classList.remove('open');
 
      if (which === 'add') { addPanel.classList.add('open'); addBtn.classList.add('open'); }
      else                 { delPanel.classList.add('open'); delBtn.classList.add('open'); }
      openPanel = which;
    }
  }
 
  render();
</script>
</body>
</html>
