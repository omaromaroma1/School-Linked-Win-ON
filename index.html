<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Linked</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 28px 40px 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      color: #1a1a2e;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    .tabs-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 2px solid #e5e7eb;
      background: #f8f9ff;
      color: #6b7280;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .tab-btn:hover { border-color: #6366f1; color: #6366f1; }
    .tab-btn.active { background: #6366f1; color: white; border-color: #6366f1; }

    .tab-add-btn {
      padding: 7px 12px;
      border-radius: 20px;
      border: 2px dashed #d1d5db;
      background: transparent;
      color: #9ca3af;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .tab-add-btn:hover { border-color: #6366f1; color: #6366f1; }

    .tab-del-btn {
      padding: 7px 12px;
      border-radius: 20px;
      border: 2px dashed #fca5a5;
      background: transparent;
      color: #f87171;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .tab-del-btn:hover { border-color: #dc2626; color: #dc2626; }

    .links {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 24px;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .link-btn {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      display: block;
      border: none;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .link-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.13); }

    .color-pick {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }
    .color-pick input[type="color"] {
      width: 200%; height: 200%;
      border: none; cursor: pointer;
      transform: translate(-25%,-25%);
    }

    .empty-msg { color: #9ca3af; font-size: 0.9rem; padding: 10px 0; }

    .bottom-bar {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .toggle-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.18s;
      letter-spacing: 0.3px;
      min-width: 60px;
    }
    .toggle-btn:hover { transform: translateY(-2px); }

    .btn-add { background: #e0e7ff; color: #4338ca; }
    .btn-add.open { background: #4338ca; color: #fff; }
    .btn-del { background: #fee2e2; color: #dc2626; }
    .btn-del.open { background: #dc2626; color: #fff; }
    .btn-key { background: #e0fdf4; color: #0d9488; }
    .btn-key.open { background: #0d9488; color: #fff; }

    .panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s ease, margin 0.35s ease;
      margin-top: 0;
    }
    .panel.open {
      max-height: 400px;
      margin-top: 14px;
    }

    .panel-inner {
      background: #f8f9ff;
      border-radius: 14px;
      padding: 18px;
      text-align: left;
    }

    .add-form { display: flex; flex-direction: column; gap: 9px; }

    .add-form input[type="text"] {
      padding: 10px 13px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .add-form input:focus { border-color: #6366f1; }

    .color-row { display: flex; gap: 9px; align-items: center; }

    .bg-swatch {
      width: 42px; height: 42px;
      border-radius: 10px;
      border: 2px solid #e5e7eb;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }
    .bg-swatch input[type="color"] {
      width: 200%; height: 200%;
      border: none; cursor: pointer;
      transform: translate(-25%,-25%);
    }

    .confirm-btn {
      width: 100%;
      padding: 11px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 11px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.18s;
    }
    .confirm-btn:hover { background: #4f46e5; transform: translateY(-2px); }

    .del-list { display: flex; flex-direction: column; gap: 8px; }

    .del-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border-radius: 10px;
      padding: 10px 13px;
      border: 2px solid #fee2e2;
    }
    .del-row span { font-weight: 600; color: #374151; font-size: 0.95rem; }

    .del-x {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      border-radius: 8px;
      width: 28px; height: 28px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .del-x:hover { background: #fca5a5; }

    .del-empty { color: #9ca3af; font-size: 0.88rem; text-align: center; padding: 6px 0; }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      width: 300px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .modal-icon {
      font-size: 2.5rem;
      line-height: 1;
    }

    .modal-box h3 {
      font-size: 1.1rem;
      color: #1a1a2e;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .modal-box p {
      font-size: 0.88rem;
      color: #6b7280;
      line-height: 1.5;
    }

    .modal-box input {
      padding: 10px 13px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
      text-align: left;
    }
    .modal-box input:focus { border-color: #6366f1; }

    .modal-btns { display: flex; gap: 8px; }
    .modal-btns button {
      flex: 1; padding: 11px;
      border: none; border-radius: 12px;
      font-weight: 700; cursor: pointer;
      font-size: 0.9rem;
      transition: transform 0.18s, background 0.2s;
    }
    .modal-btns button:hover { transform: translateY(-2px); }
    .modal-cancel { background: #f3f4f6; color: #6b7280; }
    .modal-cancel:hover { background: #e5e7eb !important; }
    .modal-confirm { background: #6366f1; color: white; }
    .modal-confirm:hover { background: #4f46e5 !important; }
    .modal-danger { background: #fee2e2; color: #dc2626; }
    .modal-danger:hover { background: #fca5a5 !important; }

    /* Popup */
    #popupView {
      display: none;
      width: 100%;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: transparent;
      padding: 16px;
    }
    #popupView.active { display: flex; }

    .popup-container {
      background: #1e1e2e;
      border-radius: 20px;
      padding: 24px 20px 18px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border: 1.5px solid rgba(255,255,255,0.08);
    }

    .popup-title {
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a5b4fc;
      text-align: center;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .popup-back {
      background: none;
      border: none;
      color: #a5b4fc;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      padding: 0;
      display: none;
    }
    .popup-back.visible { display: block; }

    .popup-tabs {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .popup-tab-btn {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: none;
      cursor: pointer;
      background: rgba(165,180,252,0.15);
      color: #e0e7ff;
      transition: transform 0.18s, background 0.18s;
      width: 100%;
    }
    .popup-tab-btn:hover { transform: translateY(-2px); background: rgba(165,180,252,0.25); }
    .popup-tab-btn span { font-size: 0.8rem; opacity: 0.5; }

    .popup-links {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .popup-link-btn {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      display: block;
      border: none;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      text-align: center;
    }
    .popup-link-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.3); }

    .popup-hint {
      text-align: center;
      font-size: 0.72rem;
      color: #4b5563;
      margin-top: 14px;
    }
  </style>
</head>
<body>

<!-- Main View -->
<div class="container" id="mainView">
  <h1>School Linked</h1>
  <div class="tabs-bar" id="tabsBar"></div>
  <div class="links" id="linkList"></div>
  <div class="bottom-bar">
    <button class="toggle-btn btn-add" id="addToggle" onclick="togglePanel('add')">＋ Link</button>
    <button class="toggle-btn btn-del" id="delToggle" onclick="togglePanel('del')">🗑 Link</button>
    <button class="toggle-btn btn-key" id="keyToggle" onclick="togglePanel('key')">⌨ Key</button>
  </div>

  <div class="panel" id="addPanel">
    <div class="panel-inner">
      <div class="add-form">
        <input type="text" id="newName" placeholder="Name (e.g. Quizlet)" />
        <input type="text" id="newUrl" placeholder="URL (e.g. quizlet.com)" />
        <div class="color-row">
          <div class="bg-swatch" id="bgPreview" style="background:#e8f0fe;">
            <input type="color" id="newBgColor" value="#e8f0fe"
              oninput="document.getElementById('bgPreview').style.background=this.value" />
          </div>
        </div>
        <button class="confirm-btn" onclick="addLink()">Add Link</button>
      </div>
    </div>
  </div>

  <div class="panel" id="delPanel">
    <div class="panel-inner">
      <div class="del-list" id="delList"></div>
    </div>
  </div>

  <div class="panel" id="keyPanel">
    <div class="panel-inner">
      <div class="add-form">
        <p style="font-size:0.85rem;color:#6b7280;margin-bottom:4px;">Current key: <strong id="currentKeyDisplay">Z</strong></p>
        <input type="text" id="newHotkey" placeholder="Type a key (e.g. F2, A, 1)" maxlength="4" />
        <button class="confirm-btn" style="background:#0d9488;" onclick="setHotkey()">Save Key</button>
      </div>
    </div>
  </div>
</div>

<!-- Add Tab Modal -->
<div class="modal-overlay" id="addTabModal">
  <div class="modal-box">
    <div class="modal-icon">📁</div>
    <h3>New Tab</h3>
    <input type="text" id="newTabName" placeholder="Tab name (e.g. Work)" />
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeTabModal()">Cancel</button>
      <button class="modal-confirm" onclick="confirmAddTab()">Create</button>
    </div>
  </div>
</div>

<!-- Delete Tab Modal -->
<div class="modal-overlay" id="delTabModal">
  <div class="modal-box">
    <div class="modal-icon">🗑️</div>
    <h3>Delete Tab</h3>
    <p id="delTabMsg">Are you sure you want to delete this tab and all its links? This cannot be undone.</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeDelTabModal()">Cancel</button>
      <button class="modal-danger" onclick="confirmDeleteTab()">Delete</button>
    </div>
  </div>
</div>

<!-- Popup View -->
<div id="popupView">
  <div class="popup-container">
    <div class="popup-title" id="popupTitle">Quick Links</div>
    <button class="popup-back" id="popupBack" onclick="popupGoBack()">← Back</button>
    <div class="popup-tabs" id="popupTabs"></div>
    <div class="popup-links" id="popupLinks" style="display:none;"></div>
    <p class="popup-hint" id="popupHint">Press your key or click outside to close</p>
  </div>
</div>

<script>
  const isPopup = window.location.search.includes('popup=true');

  let ipcRenderer = null;
  try { ipcRenderer = require('electron').ipcRenderer; } catch(e) {}

  const defaultData = {
    activeTab: 0,
    tabs: [
      {
        name: "School",
        links: [
          { name: "McGrawHill",   url: "https://my.mheducation.com/login", bg: "#e8f0fe", color: "#1a56db" },
          { name: "Khan Academy", url: "https://www.khanacademy.org/profile/me/classroom/ce0ca203-5a26-4bcf-8287-8304cbc765e7", bg: "#fef3e2", color: "#c05621" },
          { name: "Classroom",    url: "https://classroom.google.com/u/3/h", bg: "#e6fffa", color: "#0d9488" },
          { name: "Alma",         url: "https://gaaq.getalma.com/home", bg: "#fce8f3", color: "#9d174d" },
        ]
      }
    ]
  };

  let data = JSON.parse(localStorage.getItem('schoolLinkedData') || 'null') || defaultData;
  let openPanel = null;

  function save() { localStorage.setItem('schoolLinkedData', JSON.stringify(data)); }

  function autoTextColor(hex) {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b)/255 > 0.55 ? '#1a1a2e' : '#ffffff';
  }

  function fixUrl(url) {
    if (!url) return '#';
    if (url.startsWith('http://') || url.startsWith('https://')) return url;
    return 'https://' + url;
  }

  function currentTab() {
    return data.tabs[data.activeTab] || data.tabs[0];
  }

  function render() {
    const tabsBar = document.getElementById('tabsBar');
    if (tabsBar) {
      tabsBar.innerHTML =
        data.tabs.map((t, i) => `
          <button class="tab-btn ${i === data.activeTab ? 'active' : ''}"
            onclick="switchTab(${i})">${t.name}</button>
        `).join('') +
        `<button class="tab-add-btn" onclick="openTabModal()">＋ Tab</button>` +
        (data.tabs.length > 1 ? `<button class="tab-del-btn" onclick="openDelTabModal()">🗑 Tab</button>` : '');
    }

    const list = document.getElementById('linkList');
    if (list) {
      const tab = currentTab();
      list.innerHTML = tab.links.length === 0
        ? '<p class="empty-msg">No links yet. Add one below!</p>'
        : tab.links.map((l,i) => `
            <div class="link-row">
              <a class="link-btn" href="${fixUrl(l.url)}" target="_blank"
                 style="background:${l.bg};color:${l.color}">${l.name}</a>
              <label class="color-pick" style="background:${l.bg}" title="Change color">
                <input type="color" value="${l.bg}" oninput="changeColor(${i},this.value)" />
              </label>
            </div>`).join('');
    }

    const dl = document.getElementById('delList');
    if (dl) {
      const tab = currentTab();
      dl.innerHTML = tab.links.length === 0
        ? '<p class="del-empty">Nothing to delete.</p>'
        : tab.links.map((l,i) => `
            <div class="del-row">
              <span>${l.name}</span>
              <button class="del-x" onclick="deleteLink(${i})">✕</button>
            </div>`).join('');
    }

    renderPopup();
  }

  function renderPopup() {
    const popupTabs = document.getElementById('popupTabs');
    const popupLinks = document.getElementById('popupLinks');
    if (!popupTabs || !popupLinks) return;

    if (data.tabs.length === 1) {
      popupTabs.style.display = 'none';
      document.getElementById('popupBack').classList.remove('visible');
      document.getElementById('popupTitle').textContent = 'Quick Links';
      popupLinks.style.display = 'flex';
      popupLinks.style.flexDirection = 'column';
      popupLinks.style.gap = '9px';
      const tab = data.tabs[0];
      popupLinks.innerHTML = tab.links.length === 0
        ? '<p style="color:#6b7280;font-size:0.9rem;text-align:center;">No links saved yet.</p>'
        : tab.links.map(l => `
            <a class="popup-link-btn" href="${fixUrl(l.url)}" target="_blank"
               style="background:${l.bg};color:${l.color}">${l.name}</a>`).join('');
    } else {
      popupLinks.style.display = 'none';
      popupTabs.style.display = 'flex';
      popupTabs.style.flexDirection = 'column';
      popupTabs.style.gap = '9px';
      document.getElementById('popupTitle').textContent = 'Quick Links';
      document.getElementById('popupBack').classList.remove('visible');
      popupTabs.innerHTML = data.tabs.map((t, i) => `
        <button class="popup-tab-btn" onclick="popupOpenTab(${i})">
          ${t.name} <span>${t.links.length} link${t.links.length !== 1 ? 's' : ''}</span>
        </button>
      `).join('');
    }
  }

  function popupOpenTab(i) {
    const tab = data.tabs[i];
    document.getElementById('popupTitle').textContent = tab.name;
    document.getElementById('popupBack').classList.add('visible');
    document.getElementById('popupTabs').style.display = 'none';
    const popupLinks = document.getElementById('popupLinks');
    popupLinks.style.display = 'flex';
    popupLinks.style.flexDirection = 'column';
    popupLinks.style.gap = '9px';
    popupLinks.innerHTML = tab.links.length === 0
      ? '<p style="color:#6b7280;font-size:0.9rem;text-align:center;">No links in this tab.</p>'
      : tab.links.map(l => `
          <a class="popup-link-btn" href="${fixUrl(l.url)}" target="_blank"
             style="background:${l.bg};color:${l.color}">${l.name}</a>`).join('');
  }

  function popupGoBack() { renderPopup(); }

  // Add Tab Modal
  function openTabModal() {
    document.getElementById('newTabName').value = '';
    document.getElementById('addTabModal').classList.add('open');
    setTimeout(() => document.getElementById('newTabName').focus(), 100);
  }

  function closeTabModal() {
    document.getElementById('addTabModal').classList.remove('open');
  }

  function confirmAddTab() {
    const name = document.getElementById('newTabName').value.trim();
    if (!name) { alert('Please enter a tab name.'); return; }
    data.tabs.push({ name: name, links: [] });
    data.activeTab = data.tabs.length - 1;
    save(); render();
    closeTabModal();
  }

  // Delete Tab Modal
  function openDelTabModal() {
    if (data.tabs.length <= 1) return;
    const tab = currentTab();
    document.getElementById('delTabMsg').textContent =
      'Are you sure you want to delete "' + tab.name + '" and all ' + tab.links.length + ' link(s) inside? This cannot be undone.';
    document.getElementById('delTabModal').classList.add('open');
  }

  function closeDelTabModal() {
    document.getElementById('delTabModal').classList.remove('open');
  }

  function confirmDeleteTab() {
    data.tabs.splice(data.activeTab, 1);
    data.activeTab = Math.max(0, data.activeTab - 1);
    save(); render();
    closeDelTabModal();
  }

  function switchTab(i) {
    data.activeTab = i;
    save(); render();
  }

  function changeColor(i, bg) {
    currentTab().links[i].bg = bg;
    currentTab().links[i].color = autoTextColor(bg);
    save(); render();
  }

  function deleteLink(i) {
    currentTab().links.splice(i, 1);
    save(); render();
  }

  function addLink() {
    const name = document.getElementById('newName').value.trim();
    const url  = document.getElementById('newUrl').value.trim();
    const bg   = document.getElementById('newBgColor').value;
    if (!name || !url) { alert('Please enter both a name and a URL.'); return; }
    const color = autoTextColor(bg);
    currentTab().links.push({name, url, bg, color});
    save(); render();
    document.getElementById('newName').value = '';
    document.getElementById('newUrl').value  = '';
    document.getElementById('newBgColor').value = '#e8f0fe';
    document.getElementById('bgPreview').style.background = '#e8f0fe';
  }

  function togglePanel(which) {
    ['add','del','key'].forEach(p => {
      document.getElementById(p + 'Panel').classList.remove('open');
      document.getElementById(p === 'add' ? 'addToggle' : p === 'del' ? 'delToggle' : 'keyToggle').classList.remove('open');
    });
    if (openPanel === which) {
      openPanel = null;
    } else {
      document.getElementById(which + 'Panel').classList.add('open');
      document.getElementById(which === 'add' ? 'addToggle' : which === 'del' ? 'delToggle' : 'keyToggle').classList.add('open');
      openPanel = which;
    }
  }

  function setHotkey() {
    const key = document.getElementById('newHotkey').value.trim().toUpperCase();
    if (!key) { alert('Please enter a key.'); return; }
    if (!ipcRenderer) { alert('Cannot set hotkey - not in Electron'); return; }
    ipcRenderer.send('set-hotkey', key);
    document.getElementById('currentKeyDisplay').textContent = key;
    document.getElementById('newHotkey').value = '';
    togglePanel('key');
    alert('Hotkey set to: ' + key);
  }

  if (ipcRenderer) {
    ipcRenderer.on('hotkey-update', (event, key) => {
      const el = document.getElementById('currentKeyDisplay');
      if (el) el.textContent = key;
      const hint = document.getElementById('popupHint');
      if (hint) hint.textContent = 'Press ' + key + ' or click outside to close';
    });
  }

  if (isPopup) {
    document.getElementById('mainView').style.display = 'none';
    document.getElementById('popupView').classList.add('active');
    document.body.style.padding = '0';
    document.body.style.background = 'transparent';
  }

  render();

  window.addEventListener('storage', () => {
    data = JSON.parse(localStorage.getItem('schoolLinkedData') || 'null') || defaultData;
    render();
  });
</script>
</body>
</html>
