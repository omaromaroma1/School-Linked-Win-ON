<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Linked</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px 40px 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 28px;
      color: #1a1a2e;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 24px;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .link-btn {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      display: block;
      border: none;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .link-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.13); }

    .color-pick {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }
    .color-pick input[type="color"] {
      width: 200%; height: 200%;
      border: none; cursor: pointer;
      transform: translate(-25%,-25%);
    }

    .empty-msg { color: #9ca3af; font-size: 0.9rem; padding: 10px 0; }

    .bottom-bar {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .toggle-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.18s;
      letter-spacing: 0.3px;
    }
    .toggle-btn:hover { transform: translateY(-2px); }

    .btn-add { background: #e0e7ff; color: #4338ca; }
    .btn-add.open { background: #4338ca; color: #fff; }
    .btn-del { background: #fee2e2; color: #dc2626; }
    .btn-del.open { background: #dc2626; color: #fff; }
    .btn-key { background: #e0fdf4; color: #0d9488; }
    .btn-key.open { background: #0d9488; color: #fff; }

    .panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s ease, padding 0.35s ease, margin 0.35s ease;
      margin-top: 0;
    }
    .panel.open {
      max-height: 400px;
      margin-top: 14px;
    }

    .panel-inner {
      background: #f8f9ff;
      border-radius: 14px;
      padding: 18px;
      text-align: left;
    }

    .add-form { display: flex; flex-direction: column; gap: 9px; }

    .add-form input[type="text"] {
      padding: 10px 13px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .add-form input:focus { border-color: #6366f1; }

    .color-row {
      display: flex;
      gap: 9px;
      align-items: center;
    }

    .bg-swatch {
      width: 42px; height: 42px;
      border-radius: 10px;
      border: 2px solid #e5e7eb;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }
    .bg-swatch input[type="color"] {
      width: 200%; height: 200%;
      border: none; cursor: pointer;
      transform: translate(-25%,-25%);
    }

    .confirm-btn {
      width: 100%;
      padding: 11px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 11px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.18s;
    }
    .confirm-btn:hover { background: #4f46e5; transform: translateY(-2px); }

    .del-list { display: flex; flex-direction: column; gap: 8px; }

    .del-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border-radius: 10px;
      padding: 10px 13px;
      border: 2px solid #fee2e2;
    }
    .del-row span { font-weight: 600; color: #374151; font-size: 0.95rem; }

    .del-x {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      border-radius: 8px;
      width: 28px; height: 28px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .del-x:hover { background: #fca5a5; }

    .del-empty { color: #9ca3af; font-size: 0.88rem; text-align: center; padding: 6px 0; }

    #popupView {
      display: none;
      width: 100%;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: transparent;
      padding: 16px;
    }

    #popupView.active { display: flex; }

    .popup-container {
      background: linear-gradient(135deg, rgba(224,231,255,0.72) 0%, rgba(240,244,255,0.72) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px 20px 18px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(99,102,241,0.1);
    }

    .popup-title {
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4338ca;
      text-align: center;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .popup-links {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .popup-link-btn {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      display: block;
      border: none;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      text-align: center;
    }
    .popup-link-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.13); }

    .popup-hint {
      text-align: center;
      font-size: 0.72rem;
      color: #a5b4fc;
      margin-top: 14px;
    }
  </style>
</head>
<body>

<!-- Main View -->
<div class="container" id="mainView">
  <h1>School Linked</h1>
  <div class="links" id="linkList"></div>
  <div class="bottom-bar">
    <button class="toggle-btn btn-add" id="addToggle" onclick="togglePanel('add')">＋ Add</button>
    <button class="toggle-btn btn-del" id="delToggle" onclick="togglePanel('del')">🗑 Delete</button>
    <button class="toggle-btn btn-key" id="keyToggle" onclick="togglePanel('key')">⌨ Key</button>
  </div>

  <div class="panel" id="addPanel">
    <div class="panel-inner">
      <div class="add-form">
        <input type="text" id="newName" placeholder="Name (e.g. Quizlet)" />
        <input type="text" id="newUrl" placeholder="URL (e.g. quizlet.com)" />
        <div class="color-row">
          <div class="bg-swatch" id="bgPreview" style="background:#e8f0fe;">
            <input type="color" id="newBgColor" value="#e8f0fe"
              oninput="document.getElementById('bgPreview').style.background=this.value" />
          </div>
        </div>
        <button class="confirm-btn" onclick="addLink()">Add Link</button>
      </div>
    </div>
  </div>

  <div class="panel" id="delPanel">
    <div class="panel-inner">
      <div class="del-list" id="delList"></div>
    </div>
  </div>

  <div class="panel" id="keyPanel">
    <div class="panel-inner">
      <div class="add-form">
        <p style="font-size:0.85rem;color:#6b7280;margin-bottom:4px;">Current key: <strong id="currentKeyDisplay">Z</strong></p>
        <input type="text" id="newHotkey" placeholder="Type a key (e.g. F2, A, 1)" maxlength="4" />
        <button class="confirm-btn" style="background:#0d9488;" onclick="setHotkey()">Save Key</button>
      </div>
    </div>
  </div>
</div>

<!-- Popup View -->
<div id="popupView">
  <div class="popup-container">
    <div class="popup-title">Quick Links</div>
    <div class="popup-links" id="popupLinkList"></div>
    <p class="popup-hint" id="popupHint">Press Z or click outside to close</p>
  </div>
</div>

<script>
  const isPopup = window.location.search.includes('popup=true');

  let ipcRenderer = null;
  try {
    ipcRenderer = require('electron').ipcRenderer;
  } catch(e) {
    console.log('ipcRenderer not available');
  }

  const defaultLinks = [
    { name: "McGrawHill",   url: "https://my.mheducation.com/login", bg: "#e8f0fe", color: "#1a56db" },
    { name: "Khan Academy", url: "https://www.khanacademy.org/profile/me/classroom/ce0ca203-5a26-4bcf-8287-8304cbc765e7", bg: "#fef3e2", color: "#c05621" },
    { name: "Classroom",    url: "https://classroom.google.com/u/3/h", bg: "#e6fffa", color: "#0d9488" },
    { name: "Alma",         url: "https://gaaq.getalma.com/home", bg: "#fce8f3", color: "#9d174d" },
  ];

  let links = JSON.parse(localStorage.getItem('schoolLinks') || 'null') || defaultLinks;
  let openPanel = null;

  function save() { localStorage.setItem('schoolLinks', JSON.stringify(links)); }

  function autoTextColor(hex) {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b)/255 > 0.55 ? '#1a1a2e' : '#ffffff';
  }

  function fixUrl(url) {
    if (!url) return '#';
    if (url.startsWith('http://') || url.startsWith('https://')) return url;
    return 'https://' + url;
  }

  function render() {
    const list = document.getElementById('linkList');
    if (list) {
      list.innerHTML = links.length === 0
        ? '<p class="empty-msg">No links yet. Add one below!</p>'
        : links.map((l,i) => `
            <div class="link-row">
              <a class="link-btn" href="${fixUrl(l.url)}" target="_blank"
                 style="background:${l.bg};color:${l.color}">${l.name}</a>
              <label class="color-pick" style="background:${l.bg}" title="Change color">
                <input type="color" value="${l.bg}" oninput="changeColor(${i},this.value)" />
              </label>
            </div>`).join('');
    }

    const dl = document.getElementById('delList');
    if (dl) {
      dl.innerHTML = links.length === 0
        ? '<p class="del-empty">Nothing to delete.</p>'
        : links.map((l,i) => `
            <div class="del-row">
              <span>${l.name}</span>
              <button class="del-x" onclick="deleteLink(${i})">✕</button>
            </div>`).join('');
    }

    const popupList = document.getElementById('popupLinkList');
    if (popupList) {
      popupList.innerHTML = links.length === 0
        ? '<p style="color:#9ca3af;font-size:0.9rem;text-align:center;">No links saved yet.</p>'
        : links.map(l => `
            <a class="popup-link-btn" href="${fixUrl(l.url)}" target="_blank"
               style="background:${l.bg};color:${l.color}">${l.name}</a>`).join('');
    }
  }

  function changeColor(i, bg) {
    links[i].bg = bg; links[i].color = autoTextColor(bg);
    save(); render();
  }

  function deleteLink(i) {
    links.splice(i,1); save(); render();
  }

  function addLink() {
    const name = document.getElementById('newName').value.trim();
    const url  = document.getElementById('newUrl').value.trim();
    const bg   = document.getElementById('newBgColor').value;
    if (!name || !url) { alert('Please enter both a name and a URL.'); return; }
    const color = autoTextColor(bg);
    links.push({name, url, bg, color});
    save(); render();
    document.getElementById('newName').value = '';
    document.getElementById('newUrl').value  = '';
    document.getElementById('newBgColor').value = '#e8f0fe';
    document.getElementById('bgPreview').style.background = '#e8f0fe';
  }

  function togglePanel(which) {
    ['add','del','key'].forEach(p => {
      document.getElementById(p + 'Panel').classList.remove('open');
      document.getElementById(p === 'add' ? 'addToggle' : p === 'del' ? 'delToggle' : 'keyToggle').classList.remove('open');
    });
    if (openPanel === which) {
      openPanel = null;
    } else {
      document.getElementById(which + 'Panel').classList.add('open');
      document.getElementById(which === 'add' ? 'addToggle' : which === 'del' ? 'delToggle' : 'keyToggle').classList.add('open');
      openPanel = which;
    }
  }

  function setHotkey() {
    const key = document.getElementById('newHotkey').value.trim().toUpperCase();
    if (!key) { alert('Please enter a key.'); return; }
    if (!ipcRenderer) { alert('Cannot set hotkey - ipcRenderer not available'); return; }
    ipcRenderer.send('set-hotkey', key);
    document.getElementById('currentKeyDisplay').textContent = key;
    document.getElementById('newHotkey').value = '';
    togglePanel('key');
    alert('Hotkey set to: ' + key);
  }

  if (ipcRenderer) {
    ipcRenderer.on('hotkey-update', (event, key) => {
      const el = document.getElementById('currentKeyDisplay');
      if (el) el.textContent = key;
      const hint = document.getElementById('popupHint');
      if (hint) hint.textContent = 'Press ' + key + ' or click outside to close';
    });
  }

  if (isPopup) {
    document.getElementById('mainView').style.display = 'none';
    document.getElementById('popupView').classList.add('active');
    document.body.style.padding = '0';
    document.body.style.background = 'transparent';
  }

  render();

  window.addEventListener('storage', () => {
    links = JSON.parse(localStorage.getItem('schoolLinks') || 'null') || defaultLinks;
    render();
  });
</script>
</body>
</html>
